<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanEmbed — North Indian Ocean Subsurface Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --deep:#071824; --panel:#0d2432; --panel2:#0a1e2a; --line:#1d3d4b;
  --teal:#33b9ac; --teal-dim:#1f6e67; --amber:#e3a04a; --coral:#e2654b; --coolblue:#5fa3d1;
  --cream:#eee8d8; --muted:#8fa5ad; --muted2:#5e7a83;
  --serif:'Source Serif 4', Georgia, serif; --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ } }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--deep); color:var(--cream); font-family:var(--sans);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(51,185,172,0.10), transparent 45%),
    radial-gradient(ellipse at 100% 0%, rgba(95,163,209,0.08), transparent 40%);
}
a{color:var(--teal);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#1c414f;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh; min-height:100dvh;}
.rail{
  width:64px; flex:none; background:var(--panel2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:4px;
  position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto;
}
.rail .brand{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--teal),#1f5a54);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:#04141a;margin-bottom:14px;font-size:15px;}
.navbtn{
  width:46px;height:46px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:var(--sans);
  font-size:8.5px;letter-spacing:.02em;text-align:center;line-height:1.1; transition:background .15s, color .15s, border-color .15s;
}
.navbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;}
.navbtn:hover{color:var(--cream); background:#123340;}
.navbtn.active{color:#04141a; background:var(--teal); border-color:var(--teal);}
.navbtn.active svg{stroke:#04141a;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}

/* context bar */
.ctxbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:rgba(13,36,50,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
  padding:10px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--muted);
}
.ctxbar .item{display:flex; gap:6px; align-items:baseline; white-space:nowrap;}
.ctxbar .item b{color:var(--cream); font-family:var(--mono); font-weight:500;}
.ctxbar .item .lbl{color:var(--muted2); text-transform:uppercase; font-size:9.5px; letter-spacing:.07em;}
.relbadge{margin-left:auto; display:flex; align-items:center; gap:8px; padding:4px 10px 4px 8px; border-radius:20px; border:1px solid var(--line); background:var(--panel2);}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.high{background:var(--teal); box-shadow:0 0 6px var(--teal);}
.dot.med{background:var(--amber); box-shadow:0 0 6px var(--amber);}
.dot.low{background:var(--coral); box-shadow:0 0 6px var(--coral);}

.content{padding:22px 26px 60px; max-width:1180px; width:100%; margin:0 auto;}
.panel{display:none;}
.panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

h1.page{font-family:var(--serif); font-size:26px; font-weight:600; margin:2px 0 4px; letter-spacing:-.01em;}
p.sub{color:var(--muted); font-size:13.5px; max-width:640px; margin:0 0 22px; line-height:1.55;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 12px;}
.section-head h2{font-family:var(--serif); font-size:16px; font-weight:600; margin:0; color:var(--cream);}
.section-head .note{font-size:11.5px; color:var(--muted2);}

.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:860px){.grid.cols-2,.grid.cols-3,.grid.cols-5{grid-template-columns:1fr 1fr;}}

.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 17px;}
.card h3{margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); font-weight:600;}
.card .big{font-family:var(--mono); font-size:24px; color:var(--cream); font-weight:500;}
.card .unit{font-size:12px; color:var(--muted); margin-left:4px;}
.card .delta{font-size:12px; margin-top:4px;}
.delta.up{color:var(--amber);} .delta.down{color:var(--coolblue);}
.est-flag{display:inline-flex; align-items:center; gap:5px; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); border:1px solid var(--teal-dim); padding:2px 7px; border-radius:20px; margin-top:8px;}
.obs-flag{display:inline-flex; align-items:center; gap:5px; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); padding:2px 7px; border-radius:20px; margin-top:8px;}

/* buttons / inputs */
button{font-family:var(--sans);}
.btn{background:var(--teal); color:#04141a; border:none; padding:9px 16px; border-radius:7px; font-weight:600; font-size:13px; cursor:pointer;}
.btn:hover{background:#3fcabc;}
.btn.ghost{background:transparent; color:var(--cream); border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--teal-dim); color:var(--teal);}
.btn.small{padding:6px 11px; font-size:12px;}
select, input[type=range]{font-family:var(--sans); font-size:13px;}
select{background:var(--panel2); color:var(--cream); border:1px solid var(--line); border-radius:6px; padding:7px 9px;}
label.fl{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted2); display:block; margin-bottom:5px;}
.controls-row{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px;}

/* map */
.mapwrap{position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#041017;}
canvas#oceanmap{display:block; width:100%; cursor:crosshair;}
.maplegend{position:absolute; bottom:10px; left:10px; background:rgba(7,24,36,.85); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:10.5px; color:var(--muted);}
.legend-grad{height:8px; width:150px; border-radius:4px; margin:4px 0;}
.legend-scale{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px;}
.maptip{position:absolute; top:10px; right:10px; background:rgba(7,24,36,.85); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:11px; color:var(--muted); max-width:220px;}
.regionlabel{position:absolute; font-family:var(--serif); font-style:italic; font-size:13px; color:rgba(238,232,216,.55); pointer-events:none;}

.chip-row{display:flex; gap:7px; flex-wrap:wrap;}
.chip{padding:6px 12px; border-radius:20px; border:1px solid var(--line); font-size:12px; color:var(--muted); cursor:pointer; background:var(--panel2); white-space:nowrap;}
.chip.active{background:var(--teal); color:#04141a; border-color:var(--teal); font-weight:600;}

.banner{border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:10px 13px; font-size:12.5px; color:var(--muted); display:flex; gap:9px; align-items:flex-start; line-height:1.5;}
.banner.warn{border-color:#5a4726; background:#1f1607;}
.banner.info b, .banner.warn b{color:var(--cream);}

table.dtab{width:100%; border-collapse:collapse; font-size:12.5px;}
table.dtab th{text-align:left; color:var(--muted2); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.06em; padding:6px 10px; border-bottom:1px solid var(--line);}
table.dtab td{padding:8px 10px; border-bottom:1px solid #12303c; font-family:var(--mono); color:var(--cream);}
table.dtab tr:hover td{background:#0f2c39;}

.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:10px;}
@media(max-width:860px){.hero{grid-template-columns:1fr;}}
.hero .lede{padding:22px 4px 0 0;}
.hero .lede .kicker{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin-bottom:10px;}
.hero .lede h1{font-size:30px; margin:0 0 12px;}
.hero .lede p{color:var(--muted); font-size:14px; line-height:1.6; max-width:520px;}
.flowline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:18px; font-size:11.5px; color:var(--muted2); font-family:var(--mono);}
.flowline span.step{background:var(--panel2); border:1px solid var(--line); padding:4px 9px; border-radius:5px; color:var(--muted);}
.flowline span.arrow{color:var(--teal-dim);}

.alertitem{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid #12303c;}
.alertitem:last-child{border-bottom:none;}
.sev{width:8px;height:8px;border-radius:50%; margin-top:5px; flex:none;}
.sev.high{background:var(--coral);} .sev.med{background:var(--amber);} .sev.low{background:var(--muted2);}
.alertitem .body{flex:1;}
.alertitem .head{font-size:13px; color:var(--cream); font-weight:500;}
.alertitem .meta{font-size:11px; color:var(--muted2); font-family:var(--mono); margin-top:2px;}

.profwrap{display:grid; grid-template-columns:1fr 200px; gap:18px;}
@media(max-width:860px){.profwrap{grid-template-columns:1fr;}}
.depthruler{position:relative; font-family:var(--mono); font-size:10.5px; color:var(--muted2); padding-top:6px;}

footer.credit{color:var(--muted2); font-size:11px; text-align:center; padding:26px 0 10px;}
.demo-badge{position:fixed; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--teal-dim); border-radius:10px; padding:13px 15px; max-width:270px; font-size:12.5px; color:var(--cream); box-shadow:0 8px 28px rgba(0,0,0,.4); z-index:40;}
.demo-badge .step-n{color:var(--teal); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px;}
.demo-badge .row{display:flex; gap:8px; margin-top:10px;}
.disclaimer{margin-top:36px; border-top:1px solid var(--line); padding-top:16px; font-size:11.5px; color:var(--muted2); line-height:1.6;}
</style>
</head>
<body>
<div class="shell">

  <nav class="rail" id="rail">
    <div class="brand">OE</div>
  </nav>

  <div class="main">
    <div class="ctxbar" id="ctxbar"></div>
    <div class="content" id="content"></div>
    <footer class="credit">OceanEmbed — SIH proof-of-concept prototype · North Indian Ocean, 5°N–30°N / 45°E–105°E · all values simulated for demonstration</footer>
  </div>
</div>

<div class="demo-badge" id="demoBadge" style="display:none;"></div>

<script>
/* =========================================================================
   OceanEmbed prototype — deterministic synthetic ocean data model
   No live satellite/ARGO feed is connected; values follow physically
   plausible seasonal/spatial patterns from seeded pseudo-random functions
   so the UI, journeys, and reliability logic are fully demonstrable.
   ========================================================================= */

const DEPTHS = [0,5,10,20,30,50,75,100,125,150,200,300,500,700,1000];
const KEY_DEPTHS = [0,50,100,200,500,1000];
const BOUNDS = {latMin:5, latMax:30, lonMin:45, lonMax:105};
const DATES = ["2026-01-15","2026-04-15","2026-07-15","2026-09-15","2026-09-20","2026-09-21","2026-09-22"];

function hash(x){ // deterministic pseudo-random 0..1
  let s = Math.sin(x*127.1)*43758.5453;
  return s - Math.floor(s);
}
function seed(lat,lon,dateIdx,salt){
  return hash(lat*12.9898 + lon*78.233 + dateIdx*37.719 + salt*5.41);
}
function dateIdx(dateStr){ return DATES.indexOf(dateStr); }
function seasonPhase(dateStr){
  const m = parseInt(dateStr.split("-")[1],10);
  return Math.sin((m/12)*2*Math.PI - Math.PI/2); // -1 (winter) .. 1 (summer/monsoon)
}
function inBoB(lat,lon){ return lon>=78; }
function regionName(lat,lon){ return inBoB(lat,lon) ? "Bay of Bengal" : "Arabian Sea"; }

function getSST(lat,lon,dateStr){
  const di = dateIdx(dateStr), sp = seasonPhase(dateStr);
  const base = 27.2 + (18-lat)*0.11; // warmer near equator
  const seasonal = sp*1.6 + (inBoB(lat,lon)? 0.4 : -0.2);
  const noise = (seed(lat,lon,di,1)-0.5)*1.1;
  return +(base + seasonal + noise).toFixed(2);
}
function getSSS(lat,lon,dateStr){
  const di = dateIdx(dateStr);
  const base = inBoB(lat,lon) ? 32.4 : 36.1; // BoB fresher (river discharge), Arabian Sea saltier
  const noise = (seed(lat,lon,di,2)-0.5)*0.6;
  return +(base+noise).toFixed(2);
}
function getSSH(lat,lon,dateStr){
  const di = dateIdx(dateStr);
  return +(( (seed(lat,lon,di,3)-0.5)*0.36 )).toFixed(2);
}
function getCurrents(lat,lon,dateStr){
  const di = dateIdx(dateStr), sp=seasonPhase(dateStr);
  const u = +(( (seed(lat,lon,di,4)-0.5)*0.9 + sp*0.25 )).toFixed(2);
  const v = +(( (seed(lat,lon,di,5)-0.5)*0.7 )).toFixed(2);
  return {u,v,speed:+Math.hypot(u,v).toFixed(2)};
}
function getWinds(lat,lon,dateStr){
  const di = dateIdx(dateStr), sp=seasonPhase(dateStr);
  const u = +(( (seed(lat,lon,di,6)-0.5)*6 + sp*4 )).toFixed(1);
  const v = +(( (seed(lat,lon,di,7)-0.5)*5 )).toFixed(1);
  return {u,v,speed:+Math.hypot(u,v).toFixed(1)};
}
function availability(lat,lon,dateStr){
  const di = dateIdx(dateStr);
  const vars = ["sst","sss","ssh","currents","winds"];
  const flags = {};
  vars.forEach((v,i)=>{ flags[v] = seed(lat,lon,di,10+i) > 0.14; }); // ~86% available, deterministic gaps
  return flags;
}
function thermoclineDepthFor(lat,lon,dateStr){
  const sp = seasonPhase(dateStr);
  let td = inBoB(lat,lon) ? 95 : 70;
  td += sp * (inBoB(lat,lon) ? 15 : -25); // Arabian Sea shoals sharply in monsoon upwelling
  td += (seed(lat,lon,dateIdx(dateStr),8)-0.5)*20;
  return Math.max(25, td);
}
/* =====================================================================
   OceanEmbed — real backend integration
   getProfile(), embeddingCoord(), validationMetrics() now try to fetch
   from the FastAPI server (localhost:8000). They fall back gracefully
   to the original deterministic simulation if the server is unreachable,
   so the demo never breaks when the backend is not running.
   ===================================================================== */

const API_BASE = 'http://localhost:8000';

// Cached response from the last successful /predict call.
// Used to share the embedding vector across getProfile + embeddingCoord
// without issuing two separate network requests.
let _lastApiResponse = null;

// ---- source badge helper -----------------------------------------------
function _setSourceBadge(badgeId, source){
  const el = document.getElementById(badgeId);
  if(!el) return;
  const isReal = source === 'real';
  const isModelSim = source === 'model_simulated_sst';
  let dotColor, label;
  if(isReal)       { dotColor='var(--teal)';  label='● Real OISST + model'; }
  else if(isModelSim){ dotColor='var(--amber)'; label='● Model (sim. SST)'; }
  else             { dotColor='var(--muted2)'; label='● Simulated'; }
  el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;font-size:9.5px;
    letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:20px;
    border:1px solid ${isReal?'var(--teal-dim)':isModelSim?'#5a4726':'var(--line)'};
    color:${dotColor};">${label}</span>`;
}

// ---- synchronous simulated fallbacks (original logic preserved) ---------
function _simProfile(lat,lon,dateStr){
  const sst = getSST(lat,lon,dateStr);
  const td = thermoclineDepthFor(lat,lon,dateStr);
  const deepT = 3.6 + (seed(lat,lon,dateIdx(dateStr),9)-0.5)*0.6;
  const thickness = 55;
  return DEPTHS.map(z=>{
    const s = 1/(1+Math.exp(-(z-td)/thickness*2.1));
    let t = sst - (sst-deepT)*s;
    if(z>700) t = Math.max(deepT-0.3, t - (z-700)*0.0015);
    return +t.toFixed(2);
  });
}
function _simEmbedding(lat,lon,dateStr){
  const sst=getSST(lat,lon,dateStr), sss=getSSS(lat,lon,dateStr), ssh=getSSH(lat,lon,dateStr);
  const cur=getCurrents(lat,lon,dateStr), wind=getWinds(lat,lon,dateStr);
  const x = (sst-27)*10 + ssh*30 + cur.u*8;
  const y = (sss-34)*6 + wind.v*3 + cur.v*8;
  // Pad to 16 dims with deterministic noise for display parity
  const extra = Array.from({length:14}, (_,i)=>+((seed(lat,lon,i,99)-0.5)*2).toFixed(4));
  return [+x.toFixed(4), +y.toFixed(4), ...extra];
}

// ---- getProfile — async, caches API response ----------------------------
function getProfile(lat,lon,dateStr){
  // Return cached API result synchronously if it matches the current request
  if(_lastApiResponse &&
     _lastApiResponse.lat === lat &&
     _lastApiResponse.lon === lon &&
     _lastApiResponse.date === dateStr){
    return _lastApiResponse.profile;
  }

  // Kick off async fetch and re-render when it resolves
  const controller = new AbortController();
  const tid = setTimeout(()=>controller.abort(), 5000);
  fetch(`${API_BASE}/predict?lat=${lat}&lon=${lon}&date=${dateStr}`,
        {signal:controller.signal})
    .then(r=>r.json())
    .then(data=>{
      clearTimeout(tid);
      _lastApiResponse = data;    // cache for embeddingCoord reuse
      // Re-render the current page so the real profile is shown
      if(state.page==='location' || state.page==='validation' ||
         state.page==='embedding' || state.page==='overview') render();
    })
    .catch(()=>{
      clearTimeout(tid);
      _lastApiResponse = null;
    });

  // Return simulated profile synchronously while the fetch is in flight
  return _simProfile(lat,lon,dateStr);
}

function climatologyProfile(lat,lon,dateStr){
  // smoothed profile without the location/date noise term - "expected" baseline
  const sp = seasonPhase(dateStr);
  const sstClim = 27.2 + (18-lat)*0.11 + sp*1.6 + (inBoB(lat,lon)?0.4:-0.2);
  const tdClim = (inBoB(lat,lon)?95:70) + sp*(inBoB(lat,lon)?15:-25);
  const deepT = 3.6;
  return DEPTHS.map(z=>{
    const s = 1/(1+Math.exp(-(z-tdClim)/55*2.1));
    return +(sstClim-(sstClim-deepT)*s).toFixed(2);
  });
}
function anomalyProfile(lat,lon,dateStr){
  const p = getProfile(lat,lon,dateStr), c = climatologyProfile(lat,lon,dateStr);
  return p.map((t,i)=>+(t-c[i]).toFixed(2));
}
function findThermoclineFromProfile(profile){
  let maxGrad=0, depthAt=DEPTHS[0];
  for(let i=1;i<profile.length;i++){
    const grad = Math.abs(profile[i]-profile[i-1])/(DEPTHS[i]-DEPTHS[i-1]);
    if(grad>maxGrad){maxGrad=grad; depthAt=(DEPTHS[i]+DEPTHS[i-1])/2;}
  }
  return Math.round(depthAt);
}
function reliabilityScore(lat,lon,dateStr){
  const flags = availability(lat,lon,dateStr);
  const avail = Object.values(flags).filter(Boolean).length/5;
  const di = dateIdx(dateStr);
  const refDensity = seed(lat,lon,di,20); // independent ARGO density proxy
  const score = avail*0.7 + refDensity*0.3;
  let label = "Low", cls="low";
  if(score>0.78){label="High"; cls="high";}
  else if(score>0.5){label="Moderate"; cls="med";}
  return {score:+score.toFixed(2), label, cls, flags, refDensity:+refDensity.toFixed(2)};
}
function heatCondition(lat,lon,dateStr){
  const anom = anomalyProfile(lat,lon,dateStr);
  const upper = anom.slice(0,7); // 0-100m
  const avg = upper.reduce((a,b)=>a+b,0)/upper.length;
  let status = "Near normal";
  if(avg>0.7) status="Elevated upper-ocean heat";
  else if(avg<-0.7) status="Below-normal upper-ocean heat";
  return {avgAnomaly:+avg.toFixed(2), status, depthRange:"0–100 m"};
}
function marineHeatwaveIndicator(lat,lon,dateStr){
  const heat = heatCondition(lat,lon,dateStr);
  const sstAnom = anomalyProfile(lat,lon,dateStr)[0];
  const possible = sstAnom>0.9 && heat.avgAnomaly>0.5;
  return {possible, sstAnom:+sstAnom.toFixed(2), threshold:0.9, basis:"SST anomaly exceeding +0.9°C combined with elevated 0–100 m heat content, relative to the seasonal climatology baseline", confirmed:false};
}

// ---- embeddingCoord — uses cached API response if available -------------
function embeddingCoord(lat,lon,dateStr){
  if(_lastApiResponse &&
     _lastApiResponse.lat === lat &&
     _lastApiResponse.lon === lon &&
     _lastApiResponse.date === dateStr &&
     _lastApiResponse.embedding){
    // Project 16-dim real embedding to 2D via first two components
    const emb = _lastApiResponse.embedding;
    return {x: +emb[0].toFixed(2), y: +emb[1].toFixed(2)};
  }
  // Fallback: original toy 2D projection
  const sst=getSST(lat,lon,dateStr), sss=getSSS(lat,lon,dateStr), ssh=getSSH(lat,lon,dateStr);
  const cur=getCurrents(lat,lon,dateStr), wind=getWinds(lat,lon,dateStr);
  const x = (sst-27)*10 + ssh*30 + cur.u*8;
  const y = (sss-34)*6 + wind.v*3 + cur.v*8;
  return {x,y};
}

const MAP_LAYERS = {
  sst:{label:"Sea Surface Temp.", unit:"°C", get:(la,lo,d)=>getSST(la,lo,d), range:[24,31], scale:"warm"},
  sss:{label:"Sea Surface Salinity", unit:"PSU", get:(la,lo,d)=>getSSS(la,lo,d), range:[31,37], scale:"teal"},
  ssh:{label:"Sea Level Anomaly", unit:"m", get:(la,lo,d)=>getSSH(la,lo,d), range:[-0.2,0.2], scale:"diverge"},
  subsurface:{label:`Subsurface Temp. @ ${state.depth}m`, unit:"°C", get:(la,lo,d)=>getProfile(la,lo,d)[DEPTHS.indexOf(state.depth)], range:[4,29], scale:"warm"},
  anomaly:{label:"Temperature Anomaly", unit:"°C", get:(la,lo,d)=>anomalyProfile(la,lo,d)[0], range:[-1.5,1.5], scale:"diverge"},
  thermocline:{label:"Thermocline Depth", unit:"m", get:(la,lo,d)=>thermoclineDepthFor(la,lo,d), range:[30,130], scale:"teal"},
};
function colorFor(val,range,scale){
  const t = Math.max(0,Math.min(1,(val-range[0])/(range[1]-range[0])));
  if(scale==="diverge"){
    if(t<0.5){ const k=t/0.5; return lerpColor([95,163,209], [230,225,210], k); }
    else{ const k=(t-0.5)/0.5; return lerpColor([230,225,210],[226,101,75], k); }
  }
  if(scale==="teal"){ return lerpColor([12,45,55],[51,185,172], t); }
  return lerpColor([50,60,120],[227,160,74], t*0.5+ (t*t)*0.5 ), lerpColor([50,60,120],[227,160,74],t);
}
function lerpColor(a,b,t){
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function warmColor(t){
  // deep blue -> teal -> amber -> coral across 0..1
  const stops=[[20,40,90],[51,185,172],[227,160,74],[226,101,75]];
  const seg = Math.min(2, Math.floor(t*3));
  const localT = (t*3)-seg;
  return lerpColor(stops[seg], stops[seg+1], localT);
}

let mapCanvasCtx=null, mapCellsMeta=[];
function drawMap(canvas, layerKey, opts={}){
  const layer = MAP_LAYERS[layerKey];
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = opts.height || 360;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.height = h+"px";
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const latStep=1.5, lonStep=1.5;
  const cols = Math.round((BOUNDS.lonMax-BOUNDS.lonMin)/lonStep);
  const rows = Math.round((BOUNDS.latMax-BOUNDS.latMin)/latStep);
  const cw = w/cols, ch = h/rows;
  mapCellsMeta = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const lat = BOUNDS.latMax - r*latStep - latStep/2;
      const lon = BOUNDS.lonMin + c*lonStep + lonStep/2;
      let val;
      if(layerKey==="subsurface") val = getProfile(lat,lon,state.date)[DEPTHS.indexOf(state.depth)];
      else val = layer.get(lat,lon,state.date);
      const t = Math.max(0,Math.min(1,(val-layer.range[0])/(layer.range[1]-layer.range[0])));
      const color = layer.scale==="diverge" ? colorFor(val,layer.range,"diverge") : (layer.scale==="teal" ? colorFor(val,layer.range,"teal") : warmColor(t));
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.92;
      ctx.fillRect(c*cw, r*ch, cw+0.6, ch+0.6);
      mapCellsMeta.push({x:c*cw,y:r*ch,w:cw,h:ch,lat,lon});
    }
  }
  // selection marker
  const selC = (state.lon-BOUNDS.lonMin)/(BOUNDS.lonMax-BOUNDS.lonMin)*w;
  const selR = (BOUNDS.latMax-state.lat)/(BOUNDS.latMax-BOUNDS.latMin)*h;
  ctx.strokeStyle="#eee8d8"; ctx.lineWidth=2; ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(selC,selR,7,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(selC-11,selR); ctx.lineTo(selC+11,selR);
  ctx.moveTo(selC,selR-11); ctx.lineTo(selC,selR+11); ctx.stroke();

  // boundary text overlays handled by DOM labels outside
  return {cols,rows,cw,ch};
}
function attachMapClicks(canvas){
  canvas.onclick = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    const lon = BOUNDS.lonMin + (x/rect.width)*(BOUNDS.lonMax-BOUNDS.lonMin);
    const lat = BOUNDS.latMax - (y/rect.height)*(BOUNDS.latMax-BOUNDS.latMin);
    state.lat = Math.round(lat*10)/10; state.lon = Math.round(lon*10)/10;
    renderCtx();
    render();
  };
}

      <label class="fl">Depth: <b style="color:var(--cream); font-family:var(--mono);">${state.depth} m</b></label>
      <input type="range" min="0" max="${DEPTHS.length-1}" value="${DEPTHS.indexOf(state.depth)}" style="width:100%;" oninput="state.depth=DEPTHS[this.value]; render();">
      <div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--muted2); margin-top:4px;">
        ${DEPTHS.map(d=>`<span>${d}</span>`).join('')}
      </div>
    </div>
  </div>
  <div class="mapwrap"><canvas id="oceanmap"></canvas>
    <div class="maplegend" id="mapLegend"></div>
  </div>
  <div class="section-head"><h2>Compare two depths</h2><span class="note">${regionName(state.lat,state.lon)} · ${state.lat.toFixed(1)}°N, ${state.lon.toFixed(1)}°E</span></div>
  <div class="grid cols-2">
    ${[state.depth, state.depth<=200?500:50].map(dv=>{
      const t = getProfile(state.lat,state.lon,state.date)[DEPTHS.indexOf(dv)];
      return `<div class="card"><h3>At ${dv} m</h3><div class="big">${t}<span class="unit">°C</span></div></div>`;
    }).join('')}
  </div>
  `;
}

function pageTime(){
  const series = DATES.map(d=>getSST(state.lat,state.lon,d));
  return `
  <h1 class="page">Time view</h1>
  <p class="sub">Historical change at ${regionName(state.lat,state.lon)}, ${state.lat.toFixed(1)}°N, ${state.lon.toFixed(1)}°E, across the available demonstration dates.</p>
  <div class="card"><canvas id="timeCanvas" height="230"></canvas></div>
  <div class="banner info" style="margin-top:14px;"><span>ⓘ</span><div>Demonstration coverage spans ${DATES.length} dates. Short-term day-to-day change is shown distinctly from the longer seasonal pattern (Jan / Apr / Jul / Sep reference dates).</div></div>
  <div class="section-head"><h2>Change table</h2><span class="note">surface temperature</span></div>
  <table class="dtab"><thead><tr><th>Date</th><th>SST (°C)</th><th>Anomaly (°C)</th><th>Thermocline (m)</th></tr></thead>
  <tbody>${DATES.map(d=>`<tr><td>${d}</td><td>${getSST(state.lat,state.lon,d)}</td><td>${fmt(anomalyProfile(state.lat,state.lon,d)[0])}</td><td>${Math.round(thermoclineDepthFor(state.lat,state.lon,d))}</td></tr>`).join('')}</tbody></table>
  `;
}

function pageCompare(){
  const A = state.compareA, B = state.compareB;
  const pA = getProfile(A.lat,A.lon,A.date), pB = getProfile(B.lat,B.lon,B.date);
  const relA = reliabilityScore(A.lat,A.lon,A.date), relB = reliabilityScore(B.lat,B.lon,B.date);
  return `
  <h1 class="page">Compare</h1>
  <p class="sub">Compare two locations, two dates, or one location across two dates. Scales are matched so profiles can be read directly against each other.</p>
  <div class="grid cols-2">
    <div class="card">
      <h3>Location A</h3>
      <div class="controls-row" style="margin-bottom:8px;">
        <div><label class="fl">Latitude</label><input type="range" min="5" max="30" step="0.5" value="${A.lat}" oninput="state.compareA.lat=+this.value; render();"><div style="font-family:var(--mono); font-size:12px;">${A.lat.toFixed(1)}°N</div></div>
        <div><label class="fl">Longitude</label><input type="range" min="45" max="105" step="0.5" value="${A.lon}" oninput="state.compareA.lon=+this.value; render();"><div style="font-family:var(--mono); font-size:12px;">${A.lon.toFixed(1)}°E</div></div>
      </div>
      <div style="font-size:12px; color:var(--muted);">${regionName(A.lat,A.lon)} · ${A.date} · reliability ${relA.label}</div>
    </div>
    <div class="card">
      <h3>Location B</h3>
      <div class="controls-row" style="margin-bottom:8px;">
        <div><label class="fl">Latitude</label><input type="range" min="5" max="30" step="0.5" value="${B.lat}" oninput="state.compareB.lat=+this.value; render();"><div style="font-family:var(--mono); font-size:12px;">${B.lat.toFixed(1)}°N</div></div>
        <div><label class="fl">Longitude</label><input type="range" min="45" max="105" step="0.5" value="${B.lon}" oninput="state.compareB.lon=+this.value; render();"><div style="font-family:var(--mono); font-size:12px;">${B.lon.toFixed(1)}°E</div></div>
      </div>
      <div style="font-size:12px; color:var(--muted);">${regionName(B.lat,B.lon)} · ${B.date} · reliability ${relB.label}</div>
    </div>
  </div>
  <div class="section-head"><h2>Profile comparison</h2></div>
  <div class="card"><canvas id="compareCanvas" height="260"></canvas></div>
  <div class="grid cols-2" style="margin-top:14px;">
    <div class="card"><h3>A — thermocline</h3><div class="big">${findThermoclineFromProfile(pA)}<span class="unit">m</span></div></div>
    <div class="card"><h3>B — thermocline</h3><div class="big">${findThermoclineFromProfile(pB)}<span class="unit">m</span></div></div>
  </div>
  `;
}

function pageEmbedding(){
  const points = [];
  for(let i=0;i<70;i++){
    const lat = 5+hash(i*3.1)*25, lon = 45+hash(i*7.7+1)*60;
    const c = embeddingCoord(lat,lon,state.date);
    points.push({...c, lat, lon, region:regionName(lat,lon)});
  }
  const sel = embeddingCoord(state.lat,state.lon,state.date);
  return `
  <h1 class="page">Ocean Embedding</h1>
  <p class="sub">SST, SSS, SSH/SLA, currents, and winds are combined into one learned representation of ocean state. Nearby points represent similar surface conditions; this view illustrates how that representation relates to the reconstructed subsurface profile.</p>
  <div class="grid cols-2">
    <div class="card">
      <h3>Embedding space (illustrative 2D projection)</h3>
      <canvas id="embedCanvas" height="300"></canvas>
    </div>
    <div class="card">
      <h3>What this shows</h3>
      <p style="font-size:12.5px; color:var(--muted); line-height:1.7;">
        Each point is one location/date's surface state. Points close together had similar SST, salinity, sea level, current, and wind conditions when they were combined into the embedding — and, in this demonstration, tend to produce similar reconstructed profiles.
      </p>
      <div class="est-flag">Model-derived representation, not a physical measurement</div>
      <h3 style="margin-top:16px;">Selected point</h3>
      <div style="font-size:12.5px; color:var(--muted);">${regionName(state.lat,state.lon)} · ${state.lat.toFixed(1)}°N, ${state.lon.toFixed(1)}°E<br>Embedding coordinates: (${sel.x.toFixed(1)}, ${sel.y.toFixed(1)})</div>
    </div>
  </div>
  `;
}

function pageValidation(){
  const metrics = validationMetrics(state.lat,state.lon,state.date);
  const profile = getProfile(state.lat,state.lon,state.date);
  // synthetic "reference/ARGO" profile = profile + small structured offset
  const ref = profile.map((t,i)=> +(t + (hash(i+state.lat+state.lon)-0.5)*0.6).toFixed(2));
  return `
  <h1 class="page">Validation</h1>
  <p class="sub">Where independent reference observations are available, predicted and reference profiles are compared directly. Validation figures below are representative demonstration values.</p>
  <div class="banner info"><span>ⓘ</span><div>Reference availability at this location: ${(reliabilityScore(state.lat,state.lon,state.date).refDensity*100).toFixed(0)}% of nearby ARGO float coverage for the selected date.</div><span id="validationBadge" style="margin-left:auto;"></span></div>
  <div class="section-head"><h2>Predicted vs. reference profile</h2></div>
  <div class="card"><canvas id="validationCanvas" height="260"></canvas></div>
  <div class="section-head"><h2>Depth-wise performance</h2></div>
  <div class="card">
    <table class="dtab"><thead><tr><th>Depth range</th><th>RMSE (°C)</th><th>Bias (°C)</th><th>Correlation</th></tr></thead>
    <tbody>${metrics.map(m=>`<tr><td>${m.depth}</td><td>${m.rmse}</td><td>${m.bias}</td><td>${m.corr}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="disclaimer">These metrics illustrate the target reporting format described in the PRD (RMSE, bias, correlation, depth-wise performance, predicted-vs-reference profiles). They are representative demonstration values, not computed from a trained model in this prototype.</div>
  `;
}

function pageReports(){
  const rel = reliabilityScore(state.lat,state.lon,state.date);
  const profile = getProfile(state.lat,state.lon,state.date);
  const td = findThermoclineFromProfile(profile);
  const heat = heatCondition(state.lat,state.lon,state.date);
  const anom = anomalyProfile(state.lat,state.lon,state.date)[0];
  return `
  <h1 class="page">Reports</h1>
  <p class="sub">Generate a summary of the current selection for research, review, or demonstration purposes.</p>
  <div class="card" id="reportPreview" style="font-family:var(--mono); font-size:12px; white-space:pre-wrap; line-height:1.7; color:var(--cream);">${reportText(state.lat,state.lon,state.date,rel,td,heat,anom)}</div>
  <div style="margin-top:14px; display:flex; gap:10px;">
    <button class="btn" onclick="downloadReport()">Download summary (.txt)</button>
    <button class="btn ghost" onclick="goto('location')">Back to location profile</button>
  </div>
  `;
}
function reportText(lat,lon,date,rel,td,heat,anom){
  return `OCEANEMBED — LOCATION SUMMARY (DEMONSTRATION)
Location: ${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E  (${regionName(lat,lon)})
Date: ${date}

SURFACE CONDITIONS
  SST   ${getSST(lat,lon,date)} °C
  SSS   ${getSSS(lat,lon,date)} PSU
  SSH   ${getSSH(lat,lon,date)} m
  Currents  ${getCurrents(lat,lon,date).speed} m/s
  Winds     ${getWinds(lat,lon,date).speed} m/s

RECONSTRUCTED PROFILE (0-1000 m)
${DEPTHS.map((d,i)=>`  ${String(d).padStart(4)} m   ${getProfile(lat,lon,date)[i].toFixed(2)} °C`).join('\n')}

THERMOCLINE      ~ ${td} m
SURFACE ANOMALY  ${fmt(anom)} °C vs. seasonal baseline
UPPER-OCEAN HEAT ${heat.status} (0-100 m mean anomaly ${fmt(heat.avgAnomaly)} °C)
RELIABILITY      ${rel.label} (score ${rel.score})

NOTE: All values above are model-derived estimates, not direct measurements.
This report was generated by a demonstration prototype using simulated data.`;
}
function downloadReport(){
  const rel = reliabilityScore(state.lat,state.lon,state.date);
  const profile = getProfile(state.lat,state.lon,state.date);
  const td = findThermoclineFromProfile(profile);
  const heat = heatCondition(state.lat,state.lon,state.date);
  const anom = anomalyProfile(state.lat,state.lon,state.date)[0];
  const txt = reportText(state.lat,state.lon,state.date,rel,td,heat,anom);
  const blob = new Blob([txt], {type:"text/plain"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `oceanembed-summary-${state.lat.toFixed(1)}N-${state.lon.toFixed(1)}E-${state.date}.txt`;
  a.click();
}

/* ---------------- render orchestration ---------------- */
function goto(p){ state.page=p; render(); }

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.page===state.page));
  renderCtx();
  const content = document.getElementById('content');
  let html = "";
  switch(state.page){
    case "overview": html = pageOverview(); break;
    case "explore": html = pageExplore(); break;
    case "location": html = pageLocation(); break;
    case "depth": html = pageDepth(); break;
    case "time": html = pageTime(); break;
    case "compare": html = pageCompare(); break;
    case "embedding": html = pageEmbedding(); break;
    case "validation": html = pageValidation(); break;
    case "reports": html = pageReports(); break;
  }
  content.innerHTML = `<div class="panel active">${html}</div>` +
    (state.page==="overview" ? `<div class="disclaimer">OceanEmbed prototype — North Indian Ocean coverage only (5°N–30°N, 45°E–105°E). Not a replacement for ARGO, buoy, glider, or ship observations. All ocean values in this build are generated by a deterministic simulation for demonstration; no live satellite or ARGO feed is connected.</div>` : '');

  destroyCharts();
  if(state.page==="explore" || state.page==="depth"){
    const canvas = document.getElementById('oceanmap');
    if(canvas){
      MAP_LAYERS.subsurface.label = `Subsurface Temp. @ ${state.depth}m`;
      if(state.page==="explore"){
        document.getElementById('layerChips').innerHTML = Object.entries(MAP_LAYERS).map(([k,v])=>
          `<span class="chip ${state.mapLayer===k?'active':''}" onclick="state.mapLayer='${k}'; render();">${v.label}</span>`).join('');
      }
      const layerKey = state.page==="depth" ? "subsurface" : state.mapLayer;
      drawMap(canvas, layerKey);
      attachMapClicks(canvas);
      const layer = MAP_LAYERS[layerKey];
      document.getElementById('mapLegend').innerHTML = `
        <div>${layer.label}</div>
        <div class="legend-grad" style="background:linear-gradient(90deg, ${layer.scale==='diverge'?'#5fa3d1,#e6e1d2,#e2654b':(layer.scale==='teal'?'#0c2d37,#33b9ac':'#14285a,#33b9ac,#e3a04a,#e2654b')});"></div>
        <div class="legend-scale"><span>${layer.range[0]}</span><span>${layer.range[1]} ${layer.unit}</span></div>`;
    }
  }
  if(state.page==="location"){
    const c = document.getElementById('profileCanvas');
    if(c){
      const profile = getProfile(state.lat,state.lon,state.date);
      const clim = climatologyProfile(state.lat,state.lon,state.date);
      profileChart = new Chart(c, {
        type:'line',
        data:{ labels: DEPTHS,
          datasets:[
            {label:'Reconstructed', data:profile, borderColor:'#33b9ac', backgroundColor:'rgba(51,185,172,.15)', tension:.3, pointRadius:2, fill:true},
            {label:'Climatology baseline', data:clim, borderColor:'#5e7a83', borderDash:[4,4], pointRadius:0, tension:.3},
          ]},
        options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
          scales:{ y:{reverse:true, title:{display:true,text:'Depth (m)'}}, x:{title:{display:true,text:'Temperature (°C)'}} },
          plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}
      });
      c.parentElement.style.height="340px";
      // Update source badge — real if API responded for this exact location+date
      const apiSrc = (_lastApiResponse &&
                      _lastApiResponse.lat === state.lat &&
                      _lastApiResponse.lon === state.lon &&
                      _lastApiResponse.date === state.date)
                     ? _lastApiResponse.source : 'simulated';
      _setSourceBadge('profileBadge', apiSrc);
    }
  }
  if(state.page==="time"){
    const c = document.getElementById('timeCanvas');
    if(c){
      timeChart = new Chart(c, {type:'line', data:{labels:DATES, datasets:[{label:'SST (°C)', data:DATES.map(d=>getSST(state.lat,state.lon,d)), borderColor:'#e3a04a', backgroundColor:'rgba(227,160,74,.15)', fill:true, tension:.3}]},
        options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}}});
    }
  }
  if(state.page==="compare"){
    const c = document.getElementById('compareCanvas');
    if(c){
      const A=state.compareA, B=state.compareB;
      profileChart = new Chart(c, {type:'line', data:{labels:DEPTHS,
        datasets:[
          {label:`A — ${regionName(A.lat,A.lon)}`, data:getProfile(A.lat,A.lon,A.date), borderColor:'#33b9ac', tension:.3, pointRadius:2},
          {label:`B — ${regionName(B.lat,B.lon)}`, data:getProfile(B.lat,B.lon,B.date), borderColor:'#e3a04a', tension:.3, pointRadius:2},
        ]},
        options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
          scales:{y:{reverse:true,title:{display:true,text:'Depth (m)'}}, x:{title:{display:true,text:'Temperature (°C)'}}},
          plugins:{legend:{position:'bottom'}}}});
      c.parentElement.style.height="340px";
    }
  }
  if(state.page==="embedding"){
    const c = document.getElementById('embedCanvas');
    if(c){
      const points = [];
      for(let i=0;i<70;i++){
        const lat = 5+hash(i*3.1)*25, lon = 45+hash(i*7.7+1)*60;
        const coord = embeddingCoord(lat,lon,state.date);
        points.push({x:coord.x, y:coord.y, region:regionName(lat,lon)});
      }
      const sel = embeddingCoord(state.lat,state.lon,state.date);
      timeChart = new Chart(c, {type:'scatter', data:{datasets:[
        {label:'Arabian Sea states', data:points.filter(p=>p.region==='Arabian Sea'), backgroundColor:'rgba(95,163,209,.65)'},
        {label:'Bay of Bengal states', data:points.filter(p=>p.region==='Bay of Bengal'), backgroundColor:'rgba(227,160,74,.65)'},
        {label:'Selected location', data:[{x:sel.x,y:sel.y}], backgroundColor:'#eee8d8', pointRadius:7, pointStyle:'rectRot'},
      ]}, options:{responsive:true, maintainAspectRatio:false, scales:{x:{title:{display:true,text:'Embedding dim. 1'}}, y:{title:{display:true,text:'Embedding dim. 2'}}}, plugins:{legend:{position:'bottom'}}}});
      c.parentElement.style.height="330px";
    }
  }
  if(state.page==="validation"){
    const c = document.getElementById('validationCanvas');
    if(c){
      const profile = getProfile(state.lat,state.lon,state.date);
      const ref = profile.map((t,i)=> +(t + (hash(i+state.lat+state.lon)-0.5)*0.6).toFixed(2));
      validationChart = new Chart(c, {type:'line', data:{labels:DEPTHS, datasets:[
        {label:'Predicted', data:profile, borderColor:'#33b9ac', pointRadius:2, tension:.3},
        {label:'Reference (ARGO, simulated)', data:ref, borderColor:'#e2654b', borderDash:[3,3], pointRadius:2, tension:.3},
      ]}, options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
        scales:{y:{reverse:true,title:{display:true,text:'Depth (m)'}}, x:{title:{display:true,text:'Temperature (°C)'}}},
        plugins:{legend:{position:'bottom'}}}});
      c.parentElement.style.height="330px";
    }
  }
}

/* ---------------- guided demo mode ---------------- */
const DEMO_STEPS = [
  {page:"overview", text:"Start on the Overview: the surface-to-intelligence journey and today's alerts."},
  {page:"explore", text:"Explore the map — surface variables and subsurface layers across the Bay of Bengal and Arabian Sea.", set:()=>{state.lat=14.5; state.lon=89.5;}},
  {page:"location", text:"Open a Location profile — surface conditions, the full depth-wise reconstruction, thermocline and anomaly."},
  {page:"depth", text:"Use Depth view to see how far a warm or cold signal extends below the surface."},
  {page:"compare", text:"Compare the Bay of Bengal against the Arabian Sea directly."},
  {page:"embedding", text:"Inspect the Ocean Embedding — how surface variables combine into one ocean-state representation."},
  {page:"validation", text:"Review Validation — predicted vs. reference profiles and depth-wise skill metrics."},
  {page:"reports", text:"Generate a Report summarising the full location intelligence for handoff."},
];
function startDemo(){ state.demo.active=true; state.demo.step=0; runDemoStep(); }
function runDemoStep(){
  const s = DEMO_STEPS[state.demo.step];
  if(s.set) s.set();
  state.page = s.page;
  render();
  const badge = document.getElementById('demoBadge');
  badge.style.display='block';
  badge.innerHTML = `<div class="step-n">Guided demo · step ${state.demo.step+1} / ${DEMO_STEPS.length}</div>
    <div>${s.text}</div>
    <div class="row">
      ${state.demo.step<DEMO_STEPS.length-1?'<button class="btn small" onclick="nextDemo()">Next</button>':'<button class="btn small" onclick="endDemo()">Finish</button>'}
      <button class="btn ghost small" onclick="endDemo()">Exit</button>
    </div>`;
}
function nextDemo(){ state.demo.step++; runDemoStep(); }
function endDemo(){ state.demo.active=false; document.getElementById('demoBadge').style.display='none'; }

/* ---------------- init ---------------- */
buildRail();
render();
window.addEventListener('resize', ()=>{ if(state.page==='explore'||state.page==='depth') render(); });
</script>
</body>
</html>
