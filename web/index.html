<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaSphere</title>
  <meta name="description" content="Calibrated subsurface ocean temperature reconstruction for the North Indian Ocean from multi-sensor satellite embeddings.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/sora-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/tabs/overview.css">
  <link rel="stylesheet" href="styles/tabs/workbench.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <script src="vendor/gsap/gsap.min.js" defer></script>
  <script src="vendor/gsap/ScrollTrigger.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="ocean-bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="ocean-bg__caustics"></div>
    <div class="ocean-bg__noise"></div>
  </div>

  <aside class="sidebar glass" aria-label="Primary">
    <a class="brand" href="#/overview" aria-label="AquaSphere home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><use href="assets/icons.svg#i-logo"></use></svg>
      <span class="brand__name">AquaSphere</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar__foot">
      <span class="sidebar__tag">SIH 26066 · OceanEmbed</span>
    </div>
  </aside>

  <header class="topbar glass" role="banner">
    <button class="icon-btn topbar__menu" id="menu-btn" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav">
      <svg aria-hidden="true"><use href="assets/icons.svg#i-menu"></use></svg>
    </button>
    <h1 class="topbar__title" id="view-title">Overview</h1>
    <div class="topbar__controls">
      <label class="field field--inline">
        <span class="field__label">Date</span>
        <select id="date-picker" class="select input--mono" disabled aria-describedby="date-hint"><option>Loading…</option></select>
        <span class="sr-only" id="date-hint">Only dates with surface observations inside the API's date range can be chosen.</span>
      </label>
      <div class="segmented" role="radiogroup" aria-label="Sensor mode" id="mode-switch">
        <button role="radio" aria-checked="true" data-mode="delayed">Delayed</button>
        <button role="radio" aria-checked="false" data-mode="nowcast">Nowcast</button>
      </div>
      <button class="status-pill" id="status-pill" aria-live="polite" title="API status">
        <span class="status-pill__dot"></span><span class="status-pill__text">Connecting…</span>
      </button>
      <span class="badge badge--demo" id="demo-badge" hidden>Offline demo (synthetic)</span>
      <button class="icon-btn" id="settings-btn" aria-label="Display settings" aria-expanded="false" aria-controls="settings">
        <svg aria-hidden="true"><use href="assets/icons.svg#i-settings"></use></svg>
      </button>
    </div>
    <div class="popover glass" id="settings" hidden>
      <label class="switch"><input type="checkbox" id="perf-toggle"><span>Performance mode</span><small>Turns off 3D and heavy effects</small></label>
      <label class="switch"><input type="checkbox" id="demo-toggle"><span>Offline demo</span><small>Synthetic data, clearly labelled. For use without the API only.</small></label>
      <button class="btn btn--ghost" id="copy-link-btn"><svg aria-hidden="true"><use href="assets/icons.svg#i-link"></use></svg>Copy link to this view</button>
      <button class="btn btn--ghost" id="export-btn"><svg aria-hidden="true"><use href="assets/icons.svg#i-export"></use></svg>Export current view</button>
    </div>
  </header>

  <div class="demo-banner" id="demo-banner" role="status" hidden>
    Offline demo is on. Every number below is <strong>synthetic</strong> and generated in your browser, not by the model.
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
  <noscript><p class="noscript">AquaSphere needs JavaScript to run.</p></noscript>
</body>
</html>
