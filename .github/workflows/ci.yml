name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. Lint & format ─────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format check
        run: ruff format --check src/ tests/

  # ── 2. Type check ────────────────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: mypy
        run: |
          mypy src/aquasphere/data \
               src/aquasphere/models \
               src/aquasphere/eval

  # ── 3. Unit + ML + data tests with coverage gate ─────────────────────────
  test:
    name: Tests (pytest >=80% coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=aquasphere \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── 4. Smoke train (2-epoch, 200-profile fixture) ────────────────────────
  smoke-train:
    name: Smoke train (2 epochs, fixture data)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run smoke train
        run: |
          python -m aquasphere.train.train \
            --config configs/model_a.yaml \
            --epochs 2 \
            --fixture tests/fixtures/argo_200.parquet \
            --no-save
        # Note: --no-save and --fixture flags will be added when train.py is built (Phase 4).
        # For now this step will pass vacuously; the gate is that the job exits 0.
        continue-on-error: true   # remove once train.py exists

  # ── 5. Docker build + /ready check ───────────────────────────────────────
  docker:
    name: Docker build + /ready
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aquasphere:ci .
      - name: Start container and check /ready
        run: |
          docker run -d --name aq_ci -p 8000:8000 aquasphere:ci
          for i in $(seq 1 15); do
            curl -s --fail http://localhost:8000/health && break || sleep 2
          done
          curl --fail http://localhost:8000/health || (docker logs aq_ci && exit 1)
          docker stop aq_ci
        continue-on-error: true   # /ready endpoint built in Phase 6; health already exists

  # ── 6. Dependency audit ───────────────────────────────────────────────────
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: pip-audit
        run: pip-audit --ignore-vuln GHSA-jfh8-c2jp-5 # example ignore; remove if none needed
        continue-on-error: true   # informational for now; will harden in Phase 6
