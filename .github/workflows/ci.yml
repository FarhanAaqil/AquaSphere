name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Lint & format ─────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: ruff check
        run: ruff check src/ tests/ scripts/
      - name: ruff format check
        run: ruff format --check src/ tests/ scripts/

  # ── 2. Type check ────────────────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: mypy
        run: |
          mypy src/aquasphere/data \
               src/aquasphere/models \
               src/aquasphere/train \
               src/aquasphere/eval \
               src/aquasphere/serve

  # ── 3. Unit + ML + data tests with coverage gate ─────────────────────────
  test:
    name: Tests (pytest >=80% coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --cov=aquasphere \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v 2>&1 | tee pytest_output.log
      - name: Test Summary
        if: always()
        run: |
          echo "### Test Execution Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 pytest_output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── 4. Browser smoke tests (Playwright + Chromium) ───────────────────────
  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install deps
        run: uv pip install --system -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest tests/e2e -v --no-cov -p no:cacheprovider

  # ── 5. Smoke train (2-epoch, 200-profile fixture) ────────────────────────
  smoke-train:
    name: Smoke train (2 epochs, fixture data)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Run smoke train
        run: |
          python -m aquasphere.train.train \
            --config configs/model_a.yaml \
            --epochs 2 \
            --fixture tests/fixtures/argo_200.parquet \
            --no-save

  # ── 6. Docker build + /ready check ───────────────────────────────────────
  docker:
    name: Docker build + /ready
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aquasphere:ci .
      - name: Start container and check /ready
        run: |
          docker run -d --name aq_ci -p 8000:8000 aquasphere:ci
          for i in $(seq 1 15); do
            curl -s --fail http://localhost:8000/health && break || sleep 2
          done
          curl --fail http://localhost:8000/health || (docker logs aq_ci && exit 1)
          curl --fail http://localhost:8000/ready || (docker logs aq_ci && exit 1)
          docker stop aq_ci

  # ── 7. Dependency audit ───────────────────────────────────────────────────
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: pip-audit
        run: pip-audit --ignore-vuln GHSA-jfh8-c2jp-5 # example ignore; remove if none needed
        continue-on-error: true   # informational for now; will harden in Phase 6
