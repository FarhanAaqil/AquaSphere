[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasphere"
version = "0.3.0.dev0"
description = "Satellite-embedding deep learning for subsurface North Indian Ocean temperature reconstruction (SIH 26066)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FarhanAaqil" }]

dependencies = [
    # Serving
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    # Data
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    # ML
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    # Config
    "pyyaml>=6.0",
    # Zarr store (Phase 3)
    "zarr>=2.17.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",          # TestClient dependency
    # Linting & formatting
    "ruff>=0.4.0",
    # Type checking
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0",
    # Pre-commit
    "pre-commit>=3.7.0",
    # Data pipeline extras (Phase 3)
    "argopy>=0.1.15",
    # Audit
    "pip-audit>=2.7.0",
]

[project.scripts]
aquasphere-serve  = "aquasphere.serve.app:main"
aquasphere-train  = "aquasphere.train.train:main"
aquasphere-eval   = "aquasphere.eval.report:main"

# ---------------------------------------------------------------------------
# Setuptools — tell it where the package lives
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI pattern)
    "N812",   # lowercase `nn` imported as non-lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["aquasphere"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict on core package
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false
warn_return_any = true
warn_unused_ignores = true
# Only enforce strict typing on our source tree
files = ["src/aquasphere/data", "src/aquasphere/models", "src/aquasphere/eval"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "scipy.*",
    "sklearn.*",
    "joblib.*",
    "zarr.*",
    "argopy.*",
    "pandas.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=aquasphere",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--tb=short",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Module aquasphere was previously imported.*",
]

[tool.coverage.run]
source = ["src/aquasphere", "aquasphere"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
